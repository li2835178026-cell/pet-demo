<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宠伴用户端</title><link rel="stylesheet" href="../css/styles.css"></head><body><main class="mobile"><div class="top"><div class="brand">宠伴</div><span class="badge">概念预览·模拟数据</span></div><p class="hint">演示日期 2026-10-01</p><h1>今天需要我们帮什么？</h1><p class="muted">说说你的安排和宠物的需要，我们先帮你梳理。</p><section class="card"><label for="request-input"><strong>描述需求</strong></label><textarea id="request-input" placeholder="例如：出差、补给或预约需求……"></textarea><p id="error" class="error" aria-live="polite"></p><div class="actions"><button class="button secondary" id="fill">一键填入样例</button><button class="button" id="submit">分析需求</button></div></section><section class="card" id="analysis" hidden><div class="task-row"><div><span class="badge">演示分析</span><h2 style="margin-top:10px">已梳理 3 项需求</h2></div><span class="status" id="result-id"></span></div><div class="stack"><div class="need"><strong>🏠 出差期间上门照护</strong><span class="hint">系统建议，用户尚未确认</span></div><div class="need"><strong>🥣 猫粮补给</strong></div><div class="need"><strong>📅 疫苗预约协调</strong><span class="hint">仅记录预约需求，不做医学判断</span></div></div><h3 style="margin-top:16px">需要继续确认</h3><div class="fields"><span class="field">航空箱：待补充</span><span class="field">地址：待补充</span><span class="field">疫苗记录：待补充</span><span class="field">猫粮规格：待补充</span><span class="field">每日照护次数：待补充</span></div></section><button class="button ghost" id="reset">重置演示数据</button></main><nav class="bottom-nav"><b>需求</b><span>订单·演示预览</span><span>我的·演示预览</span></nav><script src="../js/data.js"></script><script src="../js/client.js"></script></body></html>
